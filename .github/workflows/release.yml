name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test -c Release
      - name: Publish (autonome, aucune dépendance)
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/ForgeOpti.App -c Release -r win-x64 -p:Version=$v -o out
          Compress-Archive -Path out/* -DestinationPath ForgeOpti-win-x64.zip
          $h = (Get-FileHash ForgeOpti-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  ForgeOpti-win-x64.zip" | Out-File -Encoding ascii ForgeOpti-win-x64.zip.sha256
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' ForgeOpti-win-x64.zip ForgeOpti-win-x64.zip.sha256 --title '${{ github.ref_name }}' --generate-notes
