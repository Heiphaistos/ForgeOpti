name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test -c Release
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Installeur, portable et zip (scripts/build-release.ps1)
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))
      - name: Manifeste de mise à jour signé (latest.json + .sig)
        shell: pwsh
        env:
          FORGEOPTI_UPDATE_KEY: ${{ secrets.FORGEOPTI_UPDATE_KEY }}
        run: ./scripts/sign-manifest.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v')) -Repo '${{ github.repository }}'
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem dist).FullName --title '${{ github.ref_name }}' --generate-notes
